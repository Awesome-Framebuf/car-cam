name: Build

on:
  push:
    branches: [main]
    paths-ignore: ['**.md', 'docs/**', 'site/**', 'tool/make_qr_codes.py', '.github/workflows/pages.yml']
  pull_request:
  workflow_dispatch:

env:
  FLUTTER_VERSION: '3.47.9'

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test

  android:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: Load signing key
        if: github.event_name != 'pull_request'
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_B64" ]; then
            echo "::warning::No signing key set; building with a throwaway debug key."
            exit 0
          fi
          echo "$KEYSTORE_B64" | base64 -d > android/release.jks
          {
            echo "storeFile=release.jks"
            echo "storePassword=$KEYSTORE_PASSWORD"
            echo "keyAlias=carcam"
            echo "keyPassword=$KEYSTORE_PASSWORD"
          } > android/key.properties
      - run: flutter build apk --release --build-number=${{ github.run_number }}
      - run: cp build/app/outputs/flutter-apk/app-release.apk CarCam.apk
      - uses: actions/upload-artifact@v4
        with:
          name: android
          path: CarCam.apk

  ios:
    needs: test
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter build ios --release --no-codesign --build-number=${{ github.run_number }}
      - name: Package unsigned IPA
        run: |
          mkdir Payload
          cp -R build/ios/iphoneos/Runner.app Payload/
          zip -qry CarCam-unsigned.ipa Payload
      - uses: actions/upload-artifact@v4
        with:
          name: ios
          path: CarCam-unsigned.ipa

  publish:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: [android, ios]
    runs-on: ubuntu-latest
    # Two publishes at once can delete each other's release.
    concurrency: publish
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
      - name: Update the "latest" release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest CarCam.apk CarCam-unsigned.ipa \
            --title "Latest build" \
            --notes "Built from ${GITHUB_SHA}." \
            --target "${GITHUB_SHA}"
      - name: Create a release for a new version
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          version="$(sed -n 's/^version: \([0-9.]*\).*/\1/p' pubspec.yaml)"
          if ! gh release view "v$version" > /dev/null 2>&1; then
            gh release create "v$version" CarCam.apk CarCam-unsigned.ipa \
              --title "Car Cam $version" \
              --notes "See the README for what's new and how to install." \
              --target "${GITHUB_SHA}"
          fi
