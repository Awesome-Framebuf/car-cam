name: Desktop

# Builds the desktop app (Linux and Windows) as artifacts on every push to
# `desktop`. A tag `desktop-v*` also publishes a GitHub release with the Linux
# tarball, CarCamSetup.exe and WiFi-Dongle-Install. Never touches `main`.
on:
  push:
    branches: [desktop]
    tags: ['desktop-v*']
    paths-ignore: ['**.md', 'site/**']
  workflow_dispatch:

env:
  FLUTTER_VERSION: '3.47.9'

jobs:
  linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: |
          sudo apt-get update -qq
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze --no-fatal-infos
      - run: flutter test
      - run: flutter build linux --release
      - name: Package
        run: |
          out=car-cam-linux-x64
          mkdir -p "$out"
          cp -a build/linux/x64/release/bundle "$out/bundle"
          cp packaging/linux/install.sh packaging/linux/car-cam.png "$out/"
          cp packaging/linux/README.txt "$out/"
          tar czf "$out.tar.gz" "$out"
      - uses: actions/upload-artifact@v4
        with:
          name: car-cam-linux-x64
          path: car-cam-linux-x64.tar.gz
      - name: Package the separate dongle driver installer
        run: |
          out=WiFi-Dongle-Install
          mkdir -p "$out/Linux" "$out/Windows"
          cp packaging/wifi-dongle/README.txt "$out/"
          cp packaging/wifi-dongle/linux/install-aic8800d80.sh "$out/Linux/"
          cp packaging/wifi-dongle/windows/install-aic8800d80.cmd "$out/Windows/"
          tar czf "$out.tar.gz" "$out"
          zip -qr "$out.zip" "$out"
      - uses: actions/upload-artifact@v4
        with:
          name: WiFi-Dongle-Install
          path: |
            WiFi-Dongle-Install.tar.gz
            WiFi-Dongle-Install.zip

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter test
      - run: flutter build windows --release
      - run: choco install innosetup -y --no-progress
      - name: Installer
        shell: pwsh
        run: |
          $v = (Select-String -Path pubspec.yaml -Pattern '^version:\s*([0-9.]+)').Matches[0].Groups[1].Value
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" "/DAppVersion=$v" packaging\windows\car-cam.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: actions/upload-artifact@v4
        with:
          name: car-cam-windows-x64
          path: packaging/windows/Output/CarCamSetup.exe

  release:
    if: startsWith(github.ref, 'refs/tags/desktop-v')
    needs: [linux, windows]
    runs-on: ubuntu-latest
    concurrency: publish
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Publish the desktop release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          ls -l dist
          gh release delete "$TAG" --yes || true
          gh release create "$TAG" \
            dist/car-cam-linux-x64.tar.gz dist/CarCamSetup.exe \
            dist/WiFi-Dongle-Install.zip dist/WiFi-Dongle-Install.tar.gz \
            --title "Car Cam desktop ${TAG#desktop-v} (Linux and Windows)" \
            --notes-file packaging/RELEASE-NOTES.md \
            --latest=false
