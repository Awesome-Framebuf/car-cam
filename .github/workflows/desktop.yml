name: Desktop

# Builds the desktop app. Artifacts only: no release is published from here.
on:
  push:
    branches: [desktop]
    paths-ignore: ['**.md', 'site/**']
  workflow_dispatch:

env:
  FLUTTER_VERSION: '3.47.9'

jobs:
  linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: |
          sudo apt-get update -qq
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze --no-fatal-infos
      - run: flutter test
      - run: flutter build linux --release
      - name: Package
        run: |
          out=car-cam-linux-x64
          mkdir -p "$out"
          cp -a build/linux/x64/release/bundle "$out/bundle"
          cp packaging/linux/install.sh packaging/linux/car-cam.png "$out/"
          cp packaging/linux/README.txt "$out/"
          tar czf "$out.tar.gz" "$out"
      - uses: actions/upload-artifact@v4
        with:
          name: car-cam-linux-x64
          path: car-cam-linux-x64.tar.gz
      - name: Package the separate dongle driver installer
        run: |
          out=WiFi-Dongle-Install
          mkdir -p "$out/Linux"
          cp packaging/wifi-dongle/README.txt "$out/"
          cp packaging/wifi-dongle/linux/install-aic8800d80.sh "$out/Linux/"
          tar czf "$out.tar.gz" "$out"
      - uses: actions/upload-artifact@v4
        with:
          name: WiFi-Dongle-Install
          path: WiFi-Dongle-Install.tar.gz
